openapi: 3.1.0
info:
  title: TechSoup Offer Center Catalog
  description: >-
    Public, read-only feed of TechSoup's catalog of technology discounts and
    donations available to nonprofits worldwide.
  version: "1.0.0"
servers:
  - url: https://offercenter.techsoup.org
paths:
  /resources/data/products.json:
    get:
      operationId: getTechSoupProductCatalog
      summary: >-
        Fetch the live TechSoup catalog of nonprofit technology discounts and
        donations, including eligibility and audit dates.
      responses:
        "200":
          description: The full product catalog as JSON.
          content:
            application/json:
              schema:
                type: object
